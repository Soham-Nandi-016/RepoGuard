[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repoguard"
version = "1.0.0"
description = "Automated Open Source Security, Compliance & Repository Hygiene Inspector"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "University of Mumbai ITL709 Recent Open Source Project Lab"}
]
keywords = ["security", "ast", "compliance", "license", "pypi", "secrets", "hygiene", "cli"]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "httpx>=0.24.0"
]

[project.scripts]
repoguard = "repoguard_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
